<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="auto">
  <rect width="600" height="350" rx="12" fill="#0f172a" />
  
  <!-- Title -->
  <text x="300" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">2D Griddata Interpolation: Irregular to Regular</text>
  
  <!-- Left Side: Scattered Input Points -->
  <g transform="translate(40, 70)">
    <text x="75" y="-15" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Scattered Sample Points</text>
    
    <!-- Boundary box -->
    <rect x="0" y="0" width="150" height="150" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    
    <!-- Scattered Points with random positions and values (represented by colors/sizes) -->
    <circle cx="30" cy="50" r="6" fill="#f43f5e" />
    <text x="30" y="38" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">85°C</text>
    
    <circle cx="110" cy="30" r="5" fill="#38bdf8" />
    <text x="110" y="18" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">20°C</text>
    
    <circle cx="50" cy="120" r="7" fill="#f59e0b" />
    <text x="50" y="108" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">60°C</text>
    
    <circle cx="120" cy="110" r="6.5" fill="#10b981" />
    <text x="120" y="98" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">45°C</text>
    
    <circle cx="80" cy="75" r="5.5" fill="#a855f7" />
    <text x="80" y="63" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">35°C</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 245,145 L 305,145" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow)" />
  <text x="275" y="135" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">griddata()</text>
  
  <!-- Right Side: Regular Interpolated Grid -->
  <g transform="translate(360, 70)">
    <text x="75" y="-15" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">Regular Interpolated Grid</text>
    
    <!-- Boundary box -->
    <rect x="0" y="0" width="150" height="150" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    
    <!-- Grid Lines -->
    <!-- Vertical -->
    <line x1="30" y1="0" x2="30" y2="150" stroke="#334155" stroke-width="1" />
    <line x1="60" y1="0" x2="60" y2="150" stroke="#334155" stroke-width="1" />
    <line x1="90" y1="0" x2="90" y2="150" stroke="#334155" stroke-width="1" />
    <line x1="120" y1="0" x2="120" y2="150" stroke="#334155" stroke-width="1" />
    
    <!-- Horizontal -->
    <line x1="0" y1="30" x2="150" y2="30" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="60" x2="150" y2="60" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="90" x2="150" y2="90" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="120" x2="150" y2="120" stroke="#334155" stroke-width="1" />
    
    <!-- Grid points (small dots showing regular sampling) -->
    <!-- Row 1 -->
    <circle cx="30" cy="30" r="3" fill="#ef4444" />
    <circle cx="60" cy="30" r="3" fill="#f97316" />
    <circle cx="90" cy="30" r="3" fill="#a855f7" />
    <circle cx="120" cy="30" r="3" fill="#3b82f6" />
    
    <!-- Row 2 -->
    <circle cx="30" cy="60" r="3" fill="#f97316" />
    <circle cx="60" cy="60" r="3" fill="#eab308" />
    <circle cx="90" cy="60" r="3" fill="#10b981" />
    <circle cx="120" cy="60" r="3" fill="#3b82f6" />
    
    <!-- Row 3 -->
    <circle cx="30" cy="90" r="3" fill="#f97316" />
    <circle cx="60" cy="90" r="3" fill="#eab308" />
    <circle cx="90" cy="90" r="3" fill="#10b981" />
    <circle cx="120" cy="90" r="3" fill="#10b981" />
    
    <!-- Row 4 -->
    <circle cx="30" cy="120" r="3" fill="#eab308" />
    <circle cx="60" cy="120" r="3" fill="#eab308" />
    <circle cx="90" cy="120" r="3" fill="#10b981" />
    <circle cx="120" cy="120" r="3" fill="#10b981" />
  </g>
  
  <!-- Footer Note -->
  <text x="300" y="270" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Methods: linear, nearest, or cubic splines for multi-dimensional space</text>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,2 L 5,5 L 0,8 z" fill="#f8fafc" />
    </marker>
  </defs>
</svg>
