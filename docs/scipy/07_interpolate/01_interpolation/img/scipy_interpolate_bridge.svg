<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="auto">
  <defs>
    <!-- River water styling -->
    <linearGradient id="river-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a365d" />
      <stop offset="50%" stop-color="#2a4365" />
      <stop offset="100%" stop-color="#1a365d" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="10" fill="#171923" />

  <!-- River Body -->
  <rect x="50" y="80" width="400" height="140" fill="url(#river-grad)" opacity="0.6" />
  
  <!-- Wave lines inside the river -->
  <path d="M 50,110 Q 150,90 250,120 T 450,100 M 50,180 Q 150,195 250,165 T 450,190" fill="none" stroke="#2b6cb0" stroke-width="1.5" opacity="0.5" />

  <!-- Stone Pillars (Data Points) -->
  <!-- Point 1 (80, 190) -->
  <!-- Point 2 (160, 100) -->
  <!-- Point 3 (260, 200) -->
  <!-- Point 4 (360, 110) -->
  <!-- Point 5 (420, 170) -->
  <g fill="#718096" stroke="#e2e8f0" stroke-width="2">
    <rect x="72" y="170" width="16" height="50" rx="3" />
    <rect x="152" y="80" width="16" height="140" rx="3" />
    <rect x="252" y="180" width="16" height="40" rx="3" />
    <rect x="352" y="90" width="16" height="130" rx="3" />
    <rect x="412" y="150" width="16" height="70" rx="3" />
  </g>
  
  <!-- Pillar Caps (The actual coordinates) -->
  <circle cx="80" cy="170" r="7" fill="#e2e8f0" />
  <circle cx="160" cy="80" r="7" fill="#e2e8f0" />
  <circle cx="260" cy="180" r="7" fill="#e2e8f0" />
  <circle cx="360" cy="90" r="7" fill="#e2e8f0" />
  <circle cx="420" cy="150" r="7" fill="#e2e8f0" />

  <!-- Bridge 1: Linear (Red Jagged) -->
  <path d="M 80,170 L 160,80 L 260,180 L 360,90 L 420,150" fill="none" stroke="#e53e3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="120" y="155" font-family="sans-serif" font-size="11" fill="#e53e3e" font-weight="bold">Linear Bridge (직선)</text>

  <!-- Bridge 2: Cubic Spline (Green Smooth) -->
  <path d="M 80,170 C 110,130 130,80 160,80 C 190,80 230,180 260,180 C 290,180 330,90 360,90 C 380,90 400,130 420,150" fill="none" stroke="#48bb78" stroke-width="3" stroke-linecap="round" />
  <text x="210" y="145" font-family="sans-serif" font-size="11" fill="#48bb78" font-weight="bold">Spline Bridge (3차 곡선)</text>

  <text x="250" y="265" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">보간법: 이산적인 측정점 사이를 연결하는 다리</text>
</svg>
