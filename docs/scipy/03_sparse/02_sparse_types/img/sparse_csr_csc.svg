<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="auto">
  <rect width="600" height="350" rx="12" fill="#0f172a" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">CSR (Compressed Sparse Row) Visualized</text>
  
  <!-- 3x3 Original Matrix -->
  <g transform="translate(40, 70)">
    <text x="0" y="-15" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Original 3x3 Matrix</text>
    
    <!-- Grid -->
    <rect x="0" y="0" width="150" height="150" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    
    <!-- Rows -->
    <rect x="10" y="10" width="40" height="40" rx="4" fill="#0369a1" />
    <text x="30" y="35" font-family="monospace" font-size="14" fill="#f0f9ff" text-anchor="middle">1</text>
    
    <rect x="60" y="10" width="40" height="40" rx="4" fill="#334155" />
    <text x="80" y="35" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">0</text>
    
    <rect x="110" y="10" width="40" height="40" rx="4" fill="#0369a1" />
    <text x="130" y="35" font-family="monospace" font-size="14" fill="#f0f9ff" text-anchor="middle">2</text>
    
    <!-- Row 1 -->
    <rect x="10" y="60" width="40" height="40" rx="4" fill="#334155" />
    <text x="30" y="85" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">0</text>
    
    <rect x="60" y="60" width="40" height="40" rx="4" fill="#334155" />
    <text x="80" y="85" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">0</text>
    
    <rect x="110" y="60" width="40" height="40" rx="4" fill="#0369a1" />
    <text x="130" y="85" font-family="monospace" font-size="14" fill="#f0f9ff" text-anchor="middle">3</text>
    
    <!-- Row 2 -->
    <rect x="10" y="110" width="40" height="40" rx="4" fill="#0369a1" />
    <text x="30" y="135" font-family="monospace" font-size="14" fill="#f0f9ff" text-anchor="middle">4</text>
    
    <rect x="60" y="110" width="40" height="40" rx="4" fill="#0369a1" />
    <text x="80" y="135" font-family="monospace" font-size="14" fill="#f0f9ff" text-anchor="middle">5</text>
    
    <rect x="110" y="110" width="40" height="40" rx="4" fill="#334155" />
    <text x="130" y="135" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">0</text>
    
    <text x="-15" y="32" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">R0</text>
    <text x="-15" y="82" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">R1</text>
    <text x="-15" y="132" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">R2</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 210,145 L 250,145" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- CSR Arrays -->
  <g transform="translate(270, 70)">
    <text x="0" y="-15" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">CSR Compressed Representation</text>
    
    <!-- Data Array -->
    <text x="0" y="15" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="bold">data:</text>
    <g transform="translate(60, 0)">
      <rect x="0" y="0" width="40" height="22" rx="3" fill="#059669" />
      <text x="20" y="16" font-family="monospace" font-size="12" fill="#f0fdf4" text-anchor="middle">1</text>
      <rect x="45" y="0" width="40" height="22" rx="3" fill="#059669" />
      <text x="65" y="16" font-family="monospace" font-size="12" fill="#f0fdf4" text-anchor="middle">2</text>
      <rect x="90" y="0" width="40" height="22" rx="3" fill="#059669" />
      <text x="110" y="16" font-family="monospace" font-size="12" fill="#f0fdf4" text-anchor="middle">3</text>
      <rect x="135" y="0" width="40" height="22" rx="3" fill="#059669" />
      <text x="155" y="16" font-family="monospace" font-size="12" fill="#f0fdf4" text-anchor="middle">4</text>
      <rect x="180" y="0" width="40" height="22" rx="3" fill="#059669" />
      <text x="200" y="16" font-family="monospace" font-size="12" fill="#f0fdf4" text-anchor="middle">5</text>
      <text x="100" y="37" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Non-zero Values (Row-major)</text>
    </g>
    
    <!-- Indices Array -->
    <text x="0" y="70" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="bold">indices:</text>
    <g transform="translate(60, 55)">
      <rect x="0" y="0" width="40" height="22" rx="3" fill="#d97706" />
      <text x="20" y="16" font-family="monospace" font-size="12" fill="#fffbeb" text-anchor="middle">0</text>
      <rect x="45" y="0" width="40" height="22" rx="3" fill="#d97706" />
      <text x="65" y="16" font-family="monospace" font-size="12" fill="#fffbeb" text-anchor="middle">2</text>
      <rect x="90" y="0" width="40" height="22" rx="3" fill="#d97706" />
      <text x="110" y="16" font-family="monospace" font-size="12" fill="#fffbeb" text-anchor="middle">2</text>
      <rect x="135" y="0" width="40" height="22" rx="3" fill="#d97706" />
      <text x="155" y="16" font-family="monospace" font-size="12" fill="#fffbeb" text-anchor="middle">0</text>
      <rect x="180" y="0" width="40" height="22" rx="3" fill="#d97706" />
      <text x="200" y="16" font-family="monospace" font-size="12" fill="#fffbeb" text-anchor="middle">1</text>
      <text x="100" y="37" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Column index of each value</text>
    </g>
    
    <!-- Indptr Array -->
    <text x="0" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="bold">indptr:</text>
    <g transform="translate(60, 110)">
      <rect x="0" y="0" width="40" height="22" rx="3" fill="#dc2626" />
      <text x="20" y="16" font-family="monospace" font-size="12" fill="#fef2f2" text-anchor="middle">0</text>
      <rect x="45" y="0" width="40" height="22" rx="3" fill="#dc2626" />
      <text x="65" y="16" font-family="monospace" font-size="12" fill="#fef2f2" text-anchor="middle">2</text>
      <rect x="90" y="0" width="40" height="22" rx="3" fill="#dc2626" />
      <text x="110" y="16" font-family="monospace" font-size="12" fill="#fef2f2" text-anchor="middle">3</text>
      <rect x="135" y="0" width="40" height="22" rx="3" fill="#dc2626" />
      <text x="155" y="16" font-family="monospace" font-size="12" fill="#fef2f2" text-anchor="middle">5</text>
      <text x="80" y="37" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Row start offsets in data/indices</text>
    </g>
  </g>
  
  <!-- Footer Note -->
  <text x="300" y="325" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">CSR indexes: row i elements are from data[indptr[i]] to data[indptr[i+1]]</text>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,2 L 5,5 L 0,8 z" fill="#f8fafc" />
    </marker>
  </defs>
</svg>
