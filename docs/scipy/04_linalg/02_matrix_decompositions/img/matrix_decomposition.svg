<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="auto">
  <rect width="600" height="350" rx="12" fill="#0f172a" />
  
  <!-- Title -->
  <text x="300" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Singular Value Decomposition (SVD): A = U · Σ · Vᵀ</text>
  
  <!-- SVD Diagram Grid -->
  <g transform="translate(40, 80)">
    <!-- Matrix A -->
    <rect x="0" y="30" width="80" height="120" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="40" y="95" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">A</text>
    <text x="40" y="170" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">M × N</text>
    
    <!-- Equal Sign -->
    <text x="110" y="95" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">=</text>
    
    <!-- Matrix U -->
    <rect x="140" y="30" width="80" height="120" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="180" y="95" font-family="sans-serif" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">U</text>
    <text x="180" y="170" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">M × M</text>
    
    <!-- Dot Sign -->
    <text x="240" y="95" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">·</text>
    
    <!-- Matrix Sigma -->
    <rect x="260" y="30" width="80" height="120" rx="6" fill="#1e293b" stroke="#d97706" stroke-width="2" />
    <!-- Diagonal Line -->
    <line x1="260" y1="30" x2="340" y2="150" stroke="#d97706" stroke-width="2" stroke-dasharray="4,4" />
    <text x="300" y="95" font-family="sans-serif" font-size="18" font-weight="bold" fill="#d97706" text-anchor="middle">Σ</text>
    <text x="300" y="170" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">M × N</text>
    
    <!-- Dot Sign -->
    <text x="360" y="95" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">·</text>
    
    <!-- Matrix V^T -->
    <rect x="380" y="30" width="120" height="120" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="2" />
    <text x="440" y="95" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f43f5e" text-anchor="middle">Vᵀ</text>
    <text x="440" y="170" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">N × N</text>
  </g>
  
  <!-- Annotations below -->
  <g transform="translate(50, 270)">
    <text x="0" y="0" font-family="sans-serif" font-size="11" fill="#cbd5e1"><tspan fill="#10b981" font-weight="bold">U</tspan>: Left Singular Vectors (Orthogonal matrix representing column space)</text>
    <text x="0" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1"><tspan fill="#d97706" font-weight="bold">Σ</tspan>: Singular Values (Diagonal matrix representing scale factor of each axis)</text>
    <text x="0" y="40" font-family="sans-serif" font-size="11" fill="#cbd5e1"><tspan fill="#f43f5e" font-weight="bold">Vᵀ</tspan>: Right Singular Vectors (Orthogonal matrix representing row space)</text>
  </g>
</svg>
