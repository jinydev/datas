<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="auto">
  <defs>
    <!-- Curve Shading Gradient -->
    <linearGradient id="bell-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4eaf9a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4eaf9a" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="rejection-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e53e3e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e53e3e" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="10" fill="#111827" />

  <!-- Coordinates -->
  <line x1="50" y1="240" x2="450" y2="240" stroke="#4b5563" stroke-width="2" />
  
  <!-- Shaded Area Under Normal Distribution (Bell Curve) -->
  <!-- Center is at x=250, standard deviation=60. Peak height=180 (y=60) -->
  <!-- Main body fill -->
  <path d="M 50,240 Q 150,240 200,160 Q 250,60 300,160 Q 350,240 450,240 Z" fill="url(#bell-grad)" />

  <!-- Rejection Region (Tails, e.g. x > 350 representing p-value cutoff) -->
  <path d="M 350,240 Q 350,205 350,205 Q 365,225 450,240 Z" fill="url(#rejection-grad)" />
  <line x1="350" y1="205" x2="350" y2="240" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="3,3" />
  
  <!-- Continuous Curve Outline -->
  <path d="M 50,240 Q 150,240 200,160 Q 250,60 300,160 Q 350,240 450,240" fill="none" stroke="#4eaf9a" stroke-width="3" />

  <!-- Mean Indicator -->
  <line x1="250" y1="60" x2="250" y2="240" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />
  <circle cx="250" cy="60" r="4" fill="#ffffff" />
  <text x="250" y="255" font-family="sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Mean (μ)</text>

  <!-- Rejection Threshold Line & Text -->
  <text x="350" y="255" font-family="sans-serif" font-size="10" fill="#e53e3e" text-anchor="middle">α = 0.05</text>
  <text x="400" y="195" font-family="sans-serif" font-size="11" fill="#e53e3e" font-weight="bold" text-anchor="middle">Rejection Region</text>

  <!-- Inspector Stamp / Decision Shield (Top Right) -->
  <g transform="translate(330, 45)" opacity="0.95">
    <rect width="135" height="55" rx="6" fill="#1f2937" stroke="#319795" stroke-width="2" />
    <text x="67" y="22" font-family="'Segoe UI', sans-serif" font-size="12" fill="#319795" font-weight="bold" text-anchor="middle">DECISION STAMP</text>
    <rect x="10" y="28" width="115" height="20" rx="3" fill="#e53e3e" />
    <text x="67" y="42" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">p-value &lt; 0.05 (True)</text>
  </g>

  <!-- Magnifying Glass Icon -->
  <g transform="translate(140, 110)">
    <circle cx="25" cy="25" r="15" fill="none" stroke="#3182ce" stroke-width="3" />
    <line x1="36" y1="36" x2="52" y2="52" stroke="#3182ce" stroke-width="4" stroke-linecap="round" />
    <text x="25" y="-5" font-family="sans-serif" font-size="11" fill="#3182ce" font-weight="bold" text-anchor="middle">t-test</text>
  </g>

  <text x="250" y="285" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">stats: 가설 검정을 통한 통계적 진실 분석</text>
</svg>
