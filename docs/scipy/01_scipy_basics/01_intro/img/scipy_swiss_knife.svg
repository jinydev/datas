<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="auto">
  <!-- Background -->
  <rect width="500" height="300" rx="10" fill="#1e1e24" />
  
  <!-- Grid -->
  <path d="M 0,50 H 500 M 0,100 H 500 M 0,150 H 500 M 0,200 H 500 M 0,250 H 500 M 50,0 V 300 M 100,0 V 300 M 150,0 V 300 M 200,0 V 300 M 250,0 V 300 M 300,0 V 300 M 350,0 V 300 M 400,0 V 300 M 450,0 V 300" stroke="#33333f" stroke-width="0.5" fill="none" />

  <!-- Swiss Knife Body -->
  <rect x="180" y="110" width="140" height="50" rx="25" fill="#e63946" stroke="#ffffff" stroke-width="2" />
  <!-- Swiss Cross logo -->
  <path d="M 245,130 H 255 M 250,125 V 135" stroke="#ffffff" stroke-width="3" stroke-linecap="square" />
  
  <!-- Tool 1: constants (Ruler) -->
  <path d="M 190,110 L 120,40 L 90,70 L 190,110" fill="none" stroke="#a8dadc" stroke-width="3" />
  <text x="95" y="45" font-family="sans-serif" font-size="11" fill="#a8dadc" font-weight="bold">constants</text>

  <!-- Tool 2: linalg (Magnifying Glass / Pivot) -->
  <circle cx="340" cy="70" r="15" fill="none" stroke="#457b9d" stroke-width="3" />
  <line x1="320" y1="110" x2="330" y2="82" stroke="#457b9d" stroke-width="3" />
  <text x="360" y="70" font-family="sans-serif" font-size="11" fill="#457b9d" font-weight="bold">linalg</text>

  <!-- Tool 3: optimize (Scissors / Target) -->
  <path d="M 280,110 L 350,220" stroke="#ffb703" stroke-width="3" />
  <circle cx="350" cy="220" r="8" fill="none" stroke="#ffb703" stroke-width="3" />
  <text x="365" y="225" font-family="sans-serif" font-size="11" fill="#ffb703" font-weight="bold">optimize</text>

  <!-- Tool 4: stats (Graph line / curve) -->
  <path d="M 210,155 L 140,230 L 80,210" fill="none" stroke="#2a9d8f" stroke-width="3" />
  <circle cx="80" cy="210" r="4" fill="#2a9d8f" />
  <circle cx="140" cy="230" r="4" fill="#2a9d8f" />
  <text x="60" y="245" font-family="sans-serif" font-size="11" fill="#2a9d8f" font-weight="bold">stats</text>
  
  <!-- Title -->
  <text x="250" y="280" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">SciPy: 파이썬 과학 컴퓨팅의 만능 멀티툴</text>
</svg>
