<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#f8f9fa" rx="15" stroke="#e9ecef" stroke-width="2"/>
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50" text-anchor="middle">Step 3: 단변수 분포 분석</text>
  
  <g transform="translate(150, 100)">
    <rect width="500" height="200" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="10"/>
    <text x="250" y="40" font-family="Arial" font-size="18" fill="#9b59b6" font-weight="bold" text-anchor="middle">의류 제품 종류별 반품 환불 분포</text>
    <text x="250" y="80" font-family="Arial" font-size="14" fill="#34495e" text-anchor="middle">신발, 상의, 아우터 등 카테고리에 따른 최종 반품(Yes/No) 빈도 대조</text>
    <rect x="50" y="110" width="400" height="60" fill="#f5eef8" rx="5"/>
    <text x="250" y="145" font-family="Courier New" font-size="16" fill="#8e44ad" font-weight="bold" text-anchor="middle">sns.countplot(x='ProductCategory', hue='Returned')</text>
  </g>
  <rect x="150" y="330" width="500" height="40" fill="#ebf5fb" rx="5"/>
  <text x="400" y="355" font-family="Arial" font-size="13" fill="#1b4f72" font-weight="bold" text-anchor="middle">직접 입어보지 못해 사이즈 교환 확률이 높은 신발/팬츠의 높은 반품율 관찰</text>
</svg>