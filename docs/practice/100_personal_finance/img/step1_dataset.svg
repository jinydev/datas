  <rect x="150" y="350" width="500" height="35" fill="#eaf2f8" rx="5"/>
  <text x="400" y="372" font-family="Arial" font-size="13" fill="#34495e" font-weight="bold" text-anchor="middle">가계 자산 포트폴리오 저축 비율 및 소득 대비 자산 관리 종합 건전 지수 분석</text>
