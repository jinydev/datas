<text x="20" y="100" font-family="Arial" font-size="14" fill="#34495e">SavingsRate: 저축 요율 (%)</text>
<text x="20" y="130" font-family="Arial" font-size="14" fill="#34495e">HousingExpenses: 주거 월세</text>
