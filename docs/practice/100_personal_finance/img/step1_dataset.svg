    <rect x="0" y="20" width="220" height="20" fill="#e74c3c"/>
    <text x="110" y="25" font-family="Arial" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">Target (종속변수)</text>
    <text x="20" y="70" font-family="Arial" font-size="14" fill="#34495e">FinancialHealthScore: 건전지수</text>
<text x="20" y="100" font-family="Arial" font-size="14" fill="#34495e">DiningExpenses: 품위 외식비</text>
