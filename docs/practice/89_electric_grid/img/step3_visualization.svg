  <rect x="150" y="330" width="500" height="40" fill="#ebf5fb" rx="5"/>
  <text x="400" y="355" font-family="Arial" font-size="13" fill="#1b4f72" font-weight="bold" text-anchor="middle">특정 노후 변전소 섹터의 높은 평균 복구 막대 대조 확인</text>
