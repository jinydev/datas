<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="auto">
  <rect width="600" height="350" rx="12" fill="#0f172a" />
  
  <!-- Title -->
  <text x="300" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Root Finding (Newton-Raphson Method)</text>
  
  <!-- Coordinate system -->
  <g transform="translate(60, 40)">
    <!-- Axes -->
    <line x1="0" y1="20" x2="0" y2="240" stroke="#94a3b8" stroke-width="2" />
    <line x1="0" y1="200" x2="480" y2="200" stroke="#94a3b8" stroke-width="2" />
    
    <text x="-10" y="15" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">y = f(x)</text>
    <text x="490" y="205" font-family="sans-serif" font-size="12" fill="#94a3b8">x</text>
    
    <!-- Curve y = f(x) -->
    <path d="M 40,240 Q 180,40 440,10" fill="none" stroke="#38bdf8" stroke-width="3" />
    <text x="410" y="35" font-family="sans-serif" font-size="12" fill="#38bdf8">y = f(x)</text>
    
    <!-- Root (Intersection of f(x) and x-axis) -->
    <!-- Approximate intersection at x = 153 -->
    <circle cx="153" cy="200" r="6" fill="#10b981" />
    <text x="153" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">Root (f(x) = 0)</text>
    
    <!-- Initial guess x0 -->
    <circle cx="340" cy="200" r="4" fill="#64748b" />
    <text x="340" y="218" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">x₀ (Guess)</text>
    
    <!-- Point on curve (x0, f(x0)) -->
    <circle cx="340" cy="48" r="4" fill="#cbd5e1" />
    <line x1="340" y1="200" x2="340" y2="48" stroke="#475569" stroke-width="1" stroke-dasharray="4,4" />
    <text x="350" y="48" font-family="sans-serif" font-size="10" fill="#94a3b8">(x₀, f(x₀))</text>
    
    <!-- Tangent line at x0 -->
    <!-- Tangent slope: from (340, 48) to (230, 200) approx -->
    <line x1="380" y1="-8" x2="230" y2="200" stroke="#f43f5e" stroke-width="2" />
    
    <!-- Next step x1 -->
    <circle cx="230" cy="200" r="4" fill="#f43f5e" />
    <text x="230" y="218" font-family="sans-serif" font-size="11" fill="#f43f5e" text-anchor="middle">x₁ (Next)</text>
    
    <!-- Arrow pointing direction of search -->
    <path d="M 320,185 L 250,185" fill="none" stroke="#f8fafc" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,2 L 5,5 L 0,8 z" fill="#f8fafc" />
    </marker>
  </defs>
</svg>
