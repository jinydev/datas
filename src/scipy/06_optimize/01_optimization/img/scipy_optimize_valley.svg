<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="auto">
  <defs>
    <!-- Slope Shading Gradient -->
    <linearGradient id="valley-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="10" fill="#171923" />

  <!-- Coordinates Grid -->
  <path d="M 50,50 V 250 H 450" stroke="#4a5568" stroke-width="2" fill="none" />
  <path d="M 50,200 H 450 M 50,150 H 450 M 50,100 H 450" stroke="#2d3748" stroke-width="0.5" fill="none" />

  <!-- Parabolic Valley Curve -->
  <!-- Minimum at x = 200, y = 200 -->
  <path d="M 80,40 Q 200,340 420,40" fill="none" stroke="#ed8936" stroke-width="4" />

  <!-- Initial Point (Start of search) -->
  <circle cx="390" cy="75" r="10" fill="#e53e3e" stroke="#ffffff" stroke-width="2" />
  <text x="390" y="55" font-family="sans-serif" font-size="11" fill="#e53e3e" font-weight="bold" text-anchor="middle">Start (x0 = 10)</text>

  <!-- Descent Steps (Ball rolling down) -->
  <path d="M 375,100 L 340,140" stroke="#ed8936" stroke-width="2" stroke-dasharray="3,3" fill="none" />
  <circle cx="340" cy="140" r="7" fill="#ecc94b" />
  
  <path d="M 325,160 L 280,185" stroke="#ed8936" stroke-width="2" stroke-dasharray="3,3" fill="none" />
  <circle cx="280" cy="185" r="7" fill="#ecc94b" />

  <!-- Optimal Minimum Destination -->
  <circle cx="200" cy="200" r="12" fill="#38a169" stroke="#ffffff" stroke-width="2" />
  <!-- Target lines -->
  <line x1="200" y1="50" x2="200" y2="250" stroke="#38a169" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="50" y1="200" x2="450" y2="200" stroke="#38a169" stroke-width="1.5" stroke-dasharray="4,4" />

  <text x="200" y="175" font-family="sans-serif" font-size="12" fill="#48bb78" font-weight="bold" text-anchor="middle">Minimum (x = 3.5)</text>
  <text x="200" y="235" font-family="sans-serif" font-size="10" fill="#a0aec0" text-anchor="middle">Objective Value: 10.0</text>

  <!-- Title/Equation -->
  <text x="250" y="30" font-family="monospace" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">f(x) = (x - 3.5)² + 10</text>
</svg>
