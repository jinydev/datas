<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="auto">
  <defs>
    <linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3182ce" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3182ce" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="10" fill="#1a202c" />

  <!-- Coordinates Grid -->
  <path d="M 50,50 V 250 H 450 M 50,250 H 450" stroke="#4a5568" stroke-width="2" fill="none" />
  <path d="M 100,50 V 250 M 150,50 V 250 M 200,50 V 250 M 250,50 V 250 M 300,50 V 250 M 350,50 V 250 M 400,50 V 250 M 50,100 H 450 M 50,150 H 450 M 50,200 H 450" stroke="#2d3748" stroke-width="0.5" fill="none" />

  <!-- Axis Labels -->
  <text x="45" y="255" font-family="sans-serif" font-size="12" fill="#a0aec0" text-anchor="end">0 (a)</text>
  <text x="350" y="267" font-family="sans-serif" font-size="12" fill="#a0aec0" text-anchor="middle">3 (b)</text>
  <text x="460" y="255" font-family="sans-serif" font-size="12" fill="#a0aec0" text-anchor="start">X</text>
  <text x="45" y="45" font-family="sans-serif" font-size="12" fill="#a0aec0" text-anchor="end">Y</text>

  <!-- Sliced Rectangles (Numerical Integration approximation) -->
  <!-- We draw several vertical bars representing the quadrature partitions -->
  <g fill="url(#area-grad)" stroke="#3182ce" stroke-width="1">
    <rect x="50" y="248" width="30" height="2" />
    <rect x="80" y="242" width="30" height="8" />
    <rect x="110" y="230" width="30" height="20" />
    <rect x="140" y="212" width="30" height="38" />
    <rect x="170" y="188" width="30" height="62" />
    <rect x="200" y="158" width="30" height="92" />
    <rect x="230" y="122" width="30" height="128" />
    <rect x="260" y="80" width="30" height="170" />
    <rect x="290" y="32" width="30" height="218" />
    <rect x="320" y="20" width="30" height="230" />
  </g>

  <!-- Continuous Curve: f(x) = x^2 -->
  <path d="M 50,250 Q 200,200 350,20" fill="none" stroke="#e53e3e" stroke-width="4" />
  <text x="260" y="60" font-family="monospace" font-size="14" fill="#e53e3e" font-weight="bold">f(x) = x²</text>

  <!-- Laser Scanner Head (Top Right) -->
  <g transform="translate(360, 50)">
    <line x1="0" y1="0" x2="-100" y2="100" stroke="#319795" stroke-width="2" stroke-dasharray="2,2" />
    <line x1="0" y1="0" x2="-180" y2="150" stroke="#319795" stroke-width="2" stroke-dasharray="2,2" />
    <line x1="0" y1="0" x2="-60" y2="60" stroke="#319795" stroke-width="2" stroke-dasharray="2,2" />
    
    <polygon points="0,0 -15,-20 15,-20" fill="#319795" />
    <circle cx="0" cy="0" r="8" fill="#e2e8f0" stroke="#319795" stroke-width="2" />
    
    <text x="25" y="5" font-family="sans-serif" font-size="12" fill="#319795" font-weight="bold">quad() Scanner</text>
  </g>

  <!-- Formula Overlay -->
  <rect x="60" y="70" width="130" height="40" rx="5" fill="#1a202c" stroke="#4a5568" stroke-width="1" />
  <text x="125" y="95" font-family="monospace" font-size="14" fill="#ffffff" text-anchor="middle">∫ x² dx = 9.0</text>
</svg>
