<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="auto">
  <rect width="600" height="350" rx="12" fill="#0f172a" />
  
  <!-- Title -->
  <text x="300" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">ODE Solver: scipy.integrate.solve_ivp</text>
  
  <!-- Coordinate Axis -->
  <g transform="translate(60, 40)">
    <!-- Y-axis -->
    <line x1="0" y1="20" x2="0" y2="240" stroke="#94a3b8" stroke-width="2" />
    <!-- X-axis (t) -->
    <line x1="0" y1="240" x2="480" y2="240" stroke="#94a3b8" stroke-width="2" />
    
    <text x="-10" y="15" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">y(t)</text>
    <text x="490" y="245" font-family="sans-serif" font-size="12" fill="#94a3b8">time (t)</text>
    
    <!-- True Solution Curve (Smooth line) -->
    <path d="M 40,200 Q 150,50 300,100 T 460,180" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6,6" />
    <text x="360" y="130" font-family="sans-serif" font-size="11" fill="#64748b">True Curve (Analytical)</text>
    
    <!-- Solver Trajectory (RK45 Steps) -->
    <!-- Point 0 (t0, y0) -->
    <circle cx="40" cy="200" r="5" fill="#10b981" />
    <text x="40" y="220" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">(t₀, y₀)</text>
    
    <!-- Step 1 (t1, y1) -->
    <circle cx="140" cy="110" r="5" fill="#38bdf8" />
    <path d="M 40,200 L 140,110" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="140" y="90" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">(t₁, y₁)</text>
    
    <!-- Tangent slope line representation -->
    <line x1="40" y1="200" x2="100" y2="146" stroke="#f43f5e" stroke-width="1.5" />
    
    <!-- Step 2 (t2, y2) -->
    <circle cx="280" cy="90" r="5" fill="#38bdf8" />
    <path d="M 140,110 L 280,90" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="280" y="70" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">(t₂, y₂)</text>
    
    <!-- Step 3 (t3, y3) -->
    <circle cx="420" cy="150" r="5" fill="#38bdf8" />
    <path d="M 280,90 L 420,150" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="420" y="130" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">(t₃, y₃)</text>
    
    <!-- Delta t indicator -->
    <line x1="140" y1="245" x2="280" y2="245" stroke="#e2e8f0" stroke-width="1" />
    <text x="210" y="260" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Δt (Adaptive step size)</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(60, 310)">
    <circle cx="10" cy="0" r="4" fill="#10b981" />
    <text x="20" y="4" font-family="sans-serif" font-size="11" fill="#cbd5e1">Initial Value</text>
    
    <circle cx="130" cy="0" r="4" fill="#38bdf8" />
    <text x="140" y="4" font-family="sans-serif" font-size="11" fill="#cbd5e1">Solver Steps</text>
    
    <line x1="250" y1="0" x2="270" y2="0" stroke="#f43f5e" stroke-width="2" />
    <text x="280" y="4" font-family="sans-serif" font-size="11" fill="#cbd5e1">Tangent Slope dy/dt = f(t, y)</text>
  </g>
</svg>
