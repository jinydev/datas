<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="auto">
  <rect width="600" height="350" rx="12" fill="#0f172a" />
  
  <!-- Title -->
  <text x="300" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">SciPy Stack &amp; Architecture</text>
  
  <!-- SciPy Sub-modules Layer (Top) -->
  <rect x="30" y="65" width="540" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="50" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Application Modules Layer (scipy.*)</text>
  
  <!-- Small module buttons inside -->
  <rect x="50" y="105" width="70" height="35" rx="4" fill="#0369a1" />
  <text x="85" y="127" font-family="monospace" font-size="11" font-weight="bold" fill="#f0f9ff" text-anchor="middle">.optimize</text>
  
  <rect x="130" y="105" width="70" height="35" rx="4" fill="#0369a1" />
  <text x="165" y="127" font-family="monospace" font-size="11" font-weight="bold" fill="#f0f9ff" text-anchor="middle">.stats</text>
  
  <rect x="210" y="105" width="70" height="35" rx="4" fill="#0369a1" />
  <text x="245" y="127" font-family="monospace" font-size="11" font-weight="bold" fill="#f0f9ff" text-anchor="middle">.integrate</text>
  
  <rect x="290" y="105" width="70" height="35" rx="4" fill="#0369a1" />
  <text x="325" y="127" font-family="monospace" font-size="11" font-weight="bold" fill="#f0f9ff" text-anchor="middle">.linalg</text>
  
  <rect x="370" y="105" width="70" height="35" rx="4" fill="#0369a1" />
  <text x="405" y="127" font-family="monospace" font-size="11" font-weight="bold" fill="#f0f9ff" text-anchor="middle">.sparse</text>
  
  <rect x="450" y="105" width="85" height="35" rx="4" fill="#0369a1" />
  <text x="492" y="127" font-family="monospace" font-size="11" font-weight="bold" fill="#f0f9ff" text-anchor="middle">.interpolate</text>
  
  <!-- SciPy Wrapper / C-Fortran Layer (Middle) -->
  <rect x="30" y="175" width="540" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2" />
  <text x="50" y="200" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f43f5e">Compiled Core (C / C++ / Fortran Wrappers)</text>
  <text x="50" y="225" font-family="sans-serif" font-size="12" fill="#cbd5e1">Wraps low-level high-performance libraries: LAPACK, BLAS, FITPACK, SuperLU</text>
  
  <!-- NumPy Layer (Bottom) -->
  <rect x="30" y="265" width="540" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="50" y="288" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981">Data Foundation: NumPy (ndarray)</text>
  <text x="50" y="306" font-family="sans-serif" font-size="12" fill="#cbd5e1">Contiguous memory management and fast array vectorization</text>
  
  <!-- Connection Arrows -->
  <path d="M 300,155 L 300,175" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 300,245 L 300,265" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,2 L 5,5 L 0,8 z" fill="#f8fafc" />
    </marker>
  </defs>
</svg>
