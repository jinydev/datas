<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 300" width="100%" height="auto">
  <defs>
    <linearGradient id="a-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>
    <linearGradient id="l-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3182ce" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </linearGradient>
    <linearGradient id="u-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38a169" />
      <stop offset="100%" stop-color="#2f855a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="550" height="300" rx="10" fill="#1a202c" />

  <!-- Matrix A -->
  <g transform="translate(40, 90)">
    <rect width="100" height="100" rx="6" fill="url(#a-grad)" stroke="#718096" stroke-width="2" />
    <path d="M 33,0 V 100 M 66,0 V 100 M 0,33 H 100 M 0,66 H 100" stroke="#4a5568" stroke-width="1" />
    <text x="50" y="58" font-family="sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">A</text>
    <text x="50" y="125" font-family="sans-serif" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="bold">Original Matrix</text>
  </g>

  <!-- Equals Sign -->
  <text x="175" y="150" font-family="sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">=</text>

  <!-- Lower Triangular Matrix L -->
  <g transform="translate(230, 90)">
    <!-- Lower triangle shape -->
    <path d="M 0,0 L 100,100 H 0 Z" fill="url(#l-grad)" stroke="#4299e1" stroke-width="2" />
    <!-- Upper triangle zero-ed out -->
    <path d="M 0,0 L 100,0 V 100 Z" fill="none" stroke="#4a5568" stroke-width="1" stroke-dasharray="3,3" />
    <text x="25" y="65" font-family="sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">L</text>
    <text x="75" y="35" font-family="monospace" font-size="16" fill="#718096" text-anchor="middle">0</text>
    <text x="50" y="125" font-family="sans-serif" font-size="12" fill="#4299e1" text-anchor="middle" font-weight="bold">Lower (하삼각)</text>
  </g>

  <!-- Multiply Sign -->
  <text x="365" y="150" font-family="sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">×</text>

  <!-- Upper Triangular Matrix U -->
  <g transform="translate(410, 90)">
    <!-- Upper triangle shape -->
    <path d="M 0,0 H 100 V 100 Z" fill="url(#u-grad)" stroke="#48bb78" stroke-width="2" />
    <!-- Lower triangle zero-ed out -->
    <path d="M 0,0 L 0,100 H 100 Z" fill="none" stroke="#4a5568" stroke-width="1" stroke-dasharray="3,3" />
    <text x="75" y="45" font-family="sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">U</text>
    <text x="25" y="75" font-family="monospace" font-size="16" fill="#718096" text-anchor="middle">0</text>
    <text x="50" y="125" font-family="sans-serif" font-size="12" fill="#48bb78" text-anchor="middle" font-weight="bold">Upper (상삼각)</text>
  </g>
</svg>
