<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 300" width="100%" height="auto">
  <defs>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="pack-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#319795" />
      <stop offset="100%" stop-color="#234e52" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="550" height="300" rx="10" fill="#171923" />

  <!-- Dense Matrix Side (Left) -->
  <g transform="translate(30, 40)">
    <rect width="180" height="180" rx="8" fill="url(#grid-grad)" stroke="#4a5568" stroke-width="2" />
    <!-- Grid cells -->
    <path d="M 30,0 V 180 M 60,0 V 180 M 90,0 V 180 M 120,0 V 180 M 150,0 V 180 M 0,30 H 180 M 0,60 H 180 M 0,90 H 180 M 0,120 H 180 M 0,150 H 180" stroke="#2d3748" stroke-width="1" />
    
    <!-- Zeros -->
    <text x="15" y="20" font-family="monospace" font-size="10" fill="#4a5568" text-anchor="middle">0</text>
    <text x="45" y="20" font-family="monospace" font-size="10" fill="#4a5568" text-anchor="middle">0</text>
    <text x="75" y="20" font-family="monospace" font-size="10" fill="#4a5568" text-anchor="middle">0</text>
    <text x="105" y="20" font-family="monospace" font-size="10" fill="#4a5568" text-anchor="middle">0</text>
    
    <!-- Non-zero values -->
    <rect x="33" y="33" width="24" height="24" rx="4" fill="#e53e3e" />
    <text x="45" y="50" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">9.5</text>
    
    <text x="75" y="50" font-family="monospace" font-size="10" fill="#4a5568" text-anchor="middle">0</text>
    
    <rect x="123" y="123" width="24" height="24" rx="4" fill="#3182ce" />
    <text x="135" y="140" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">4.2</text>
    
    <!-- Remaining zeros dots -->
    <text x="15" y="110" font-family="monospace" font-size="12" fill="#4a5568" text-anchor="middle">···</text>
    <text x="90" y="110" font-family="monospace" font-size="12" fill="#4a5568" text-anchor="middle">···</text>
    <text x="165" y="110" font-family="monospace" font-size="12" fill="#4a5568" text-anchor="middle">···</text>

    <!-- Label -->
    <text x="90" y="210" font-family="sans-serif" font-size="14" fill="#a0aec0" text-anchor="middle" font-weight="bold">밀집 행렬 (Dense: 8MB)</text>
  </g>

  <!-- Vacuum Nozzle (Center) -->
  <g transform="translate(225, 110)">
    <path d="M 0,20 Q 30,20 40,0 L 50,0 Q 40,30 0,40 Z" fill="#e2e8f0" opacity="0.8" />
    <path d="M 0,0 C 15,10 30,10 45,5" stroke="#319795" stroke-width="2" stroke-dasharray="3,3" fill="none" />
    <text x="20" y="-10" font-family="sans-serif" font-size="10" fill="#319795" font-weight="bold" text-anchor="middle">0 제거</text>
  </g>

  <!-- Sparse Matrix Side (Right) -->
  <g transform="translate(320, 40)">
    <rect width="180" height="180" rx="8" fill="url(#pack-grad)" stroke="#319795" stroke-width="2" />
    
    <!-- Compact table layout -->
    <text x="90" y="30" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">압축 진공 포장</text>
    
    <g transform="translate(20, 50)">
      <!-- Table Header -->
      <rect x="0" y="0" width="140" height="20" fill="#234e52" />
      <text x="35" y="14" font-family="sans-serif" font-size="10" fill="#e6fffa" font-weight="bold" text-anchor="middle">위치(Row,Col)</text>
      <text x="105" y="14" font-family="sans-serif" font-size="10" fill="#e6fffa" font-weight="bold" text-anchor="middle">값(Value)</text>
      <line x1="70" y1="0" x2="70" y2="70" stroke="#319795" stroke-width="1" />
      
      <!-- Row 1 -->
      <rect x="0" y="20" width="140" height="25" fill="#1d4044" stroke="#319795" stroke-width="0.5" />
      <text x="35" y="37" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">(1, 1)</text>
      <text x="105" y="37" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">9.5</text>
      
      <!-- Row 2 -->
      <rect x="0" y="45" width="140" height="25" fill="#1d4044" stroke="#319795" stroke-width="0.5" />
      <text x="35" y="62" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">(4, 4)</text>
      <text x="105" y="62" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">4.2</text>
    </g>

    <!-- Metadata indices info -->
    <text x="90" y="150" font-family="sans-serif" font-size="11" fill="#e6fffa" text-anchor="middle">data: [9.5, 4.2]</text>
    <text x="90" y="165" font-family="sans-serif" font-size="11" fill="#e6fffa" text-anchor="middle">indices: [1, 4]  indptr: [0, 0, 1...]</text>

    <!-- Label -->
    <text x="90" y="210" font-family="sans-serif" font-size="14" fill="#319795" text-anchor="middle" font-weight="bold">희소 행렬 (CSR: 4KB)</text>
  </g>
</svg>
