<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#f8f9fa" rx="15" stroke="#e9ecef" stroke-width="2"/>
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50" text-anchor="middle">Step 3: 단변수 분포 분석</text>
  
  <g transform="translate(150, 100)">
    <rect width="500" height="200" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="10"/>
    <text x="250" y="40" font-family="Arial" font-size="18" fill="#9b59b6" font-weight="bold" text-anchor="middle">가계 종합 금융 건전 지표 분포 진단</text>
    <text x="250" y="80" font-family="Arial" font-size="14" fill="#34495e" text-anchor="middle">가계의 자산 건전 등급(Financial Health Score) 고른 정도를 요약합니다.</text>
    <rect x="50" y="110" width="400" height="60" fill="#f5eef8" rx="5"/>
    <text x="250" y="145" font-family="Courier New" font-size="16" fill="#8e44ad" font-weight="bold" text-anchor="middle">sns.histplot(x='FinancialHealthScore', kde=True)</text>
  </g>
  <rect x="150" y="330" width="500" height="40" fill="#ebf5fb" rx="5"/>
  <text x="400" y="355" font-family="Arial" font-size="13" fill="#1b4f72" font-weight="bold" text-anchor="middle">대부분 45~75점 사이의 완만한 종형 정규 가우스 곡선 확인</text>
</svg>