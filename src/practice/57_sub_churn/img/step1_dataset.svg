  <rect x="150" y="350" width="500" height="35" fill="#eaf2f8" rx="5"/>
  <text x="400" y="372" font-family="Arial" font-size="13" fill="#34495e" font-weight="bold" text-anchor="middle">구독 멤버십 가입 기간 및 이용 강도 대비 해지 행동 통계 분석</text>
